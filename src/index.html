<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Auth - Sign In & Sign Up</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #f1f5f9;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: #10b981;
      border-bottom: 2px solid #10b981;
      margin-bottom: -2px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background: #059669;
    }
    .success-message {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 8px;
      color: #065f46;
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
    }
    .error-message {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    .info-message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      box-sizing: border-box;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .cancel-btn {
      width: 100%;
      padding: 10px;
      background: #f1f5f9;
      color: #475569;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .google-btn {
      width: 100%;
      padding: 11px;
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .google-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0 16px;
      color: #94a3b8;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider span {
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-signin-btn" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tab-signup-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" onsubmit="onSignInSubmit(event)">
      <!-- Success message displayed on Sign In page after Sign Up -->
      <div id="signin-success-message" class="success-message"></div>

      <!-- Google Sign In Button -->
      <button type="button" class="google-btn" onclick="onGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Sign in with Google</span>
      </button>

      <div class="divider"><span>or sign in with email</span></div>

      <div class="form-group">
        <label for="signin-email">Email Address</label>
        <input type="email" id="signin-email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="signin-password" style="margin-bottom: 0;">Password</label>
          <a href="#" onclick="openForgotPassword(event)" style="font-size: 12px; color: #10b981; text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>
        <input type="password" id="signin-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="signin-submit-btn">Sign In</button>
      <!-- Small error message displayed under the form -->
      <div id="signin-error-message" class="error-message"></div>
    </form>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 style="margin-top: 0; margin-bottom: 8px; color: #1e293b;">Reset Password</h3>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 16px; line-height: 1.4;">
          Enter your email address and we'll send you instructions to recover and reset your password.
        </p>
        <form onsubmit="onForgotPasswordSubmit(event)">
          <div class="form-group">
            <label for="reset-email">Email Address</label>
            <input type="email" id="reset-email" placeholder="name@example.com" required>
          </div>
          <button type="submit" class="submit-btn" id="reset-submit-btn">Send Recovery Link</button>
          <button type="button" class="cancel-btn" onclick="closeForgotPassword()">Cancel</button>
          <div id="reset-success-message" class="success-message" style="margin-top: 14px; margin-bottom: 0;"></div>
          <div id="reset-error-message" class="error-message"></div>
        </form>
      </div>
    </div>

    <!-- Sign Up Form -->
    <form id="signup-form" style="display: none;" onsubmit="onSignUpSubmit(event)">
      <!-- Google Sign Up Button -->
      <button type="button" class="google-btn" onclick="onGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Sign up with Google</span>
      </button>

      <div class="divider"><span>or create account with email</span></div>

      <div class="form-group">
        <label for="signup-name">Display Name / Full Name</label>
        <input type="text" id="signup-name" placeholder="Alex Johnson" required>
      </div>
      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Create Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="signup-submit-btn">Create Account</button>
      <!-- Small error message displayed under the form -->
      <div id="signup-error-message" class="error-message"></div>
      <!-- Email confirmation notice when session is null -->
      <div id="signup-info-message" class="info-message"></div>
    </form>
  </div>

  <script type="module">
    import { handleSignIn, handleSignUp, handleForgotPassword, signInWithGoogle, protectRoute } from './Auth.js';

    // To protect any private page on load:
    // await protectRoute('/login');

    window.openForgotPassword = function(e) {
      if (e) e.preventDefault();
      const currentEmail = document.getElementById('signin-email').value;
      if (currentEmail) {
        document.getElementById('reset-email').value = currentEmail.trim();
      }
      document.getElementById('reset-success-message').style.display = 'none';
      document.getElementById('reset-error-message').style.display = 'none';
      document.getElementById('forgot-password-modal').style.display = 'flex';
    };

    window.closeForgotPassword = function() {
      document.getElementById('forgot-password-modal').style.display = 'none';
    };

    window.onForgotPasswordSubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const btn = document.getElementById('reset-submit-btn');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      await handleForgotPassword(email, 'reset-success-message', 'reset-error-message');

      btn.innerText = 'Send Recovery Link';
      btn.disabled = false;
    };

    window.onGoogleSignIn = async function() {
      await signInWithGoogle();
    };

    // To protect any private page on load:
    // await protectRoute('/login');

    window.switchTab = function(tab) {
      const isSignIn = tab === 'signin';
      document.getElementById('signin-form').style.display = isSignIn ? 'block' : 'none';
      document.getElementById('signup-form').style.display = isSignIn ? 'none' : 'block';
      document.getElementById('tab-signin-btn').classList.toggle('active', isSignIn);
      document.getElementById('tab-signup-btn').classList.toggle('active', !isSignIn);
      
      // Clear error messages
      document.getElementById('signin-error-message').style.display = 'none';
      document.getElementById('signup-error-message').style.display = 'none';
      document.getElementById('signup-info-message').style.display = 'none';
    };

    window.onSignInSubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const btn = document.getElementById('signin-submit-btn');
      btn.innerText = 'Signing In...';
      btn.disabled = true;

      await handleSignIn(email, password, 'signin-error-message');

      btn.innerText = 'Sign In';
      btn.disabled = false;
    };

    window.onSignUpSubmit = async function(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const btn = document.getElementById('signup-submit-btn');
      btn.innerText = 'Creating Account...';
      btn.disabled = true;

      const result = await handleSignUp(
        email,
        password,
        name,
        'signup-error-message',
        'signup-info-message',
        'signin-success-message',
        'signin-email'
      );

      btn.innerText = 'Create Account';
      btn.disabled = false;

      if (result.success) {
        // Clear password input in signup form
        document.getElementById('signup-password').value = '';
        // Switch to sign in tab
        window.switchTab('signin');
        // Pre-fill email in signin form
        document.getElementById('signin-email').value = email.trim();
        // Show success message on sign in form
        const successElem = document.getElementById('signin-success-message');
        if (successElem) {
          successElem.innerText = result.message || 'Account created successfully! Check your email to verify your account or sign in below.';
          successElem.style.display = 'block';
        }
        // Focus password input for smooth UX
        const pwdInput = document.getElementById('signin-password');
        if (pwdInput) pwdInput.focus();
      }
    };

    // Check URL parameters for prefilled email from redirects (e.g., /login?email=...&registered=true)
    const urlParams = new URLSearchParams(window.location.search);
    const prefillEmail = urlParams.get('email');
    const isRegistered = urlParams.get('registered') === 'true';

    if (prefillEmail) {
      const emailInput = document.getElementById('signin-email');
      if (emailInput) emailInput.value = prefillEmail;
    }
    if (isRegistered) {
      const successElem = document.getElementById('signin-success-message');
      if (successElem) {
        successElem.innerText = 'Account created successfully! Check your email to verify your account or sign in below.';
        successElem.style.display = 'block';
      }
      window.switchTab('signin');
    }
  </script>
</body>
</html>
